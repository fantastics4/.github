name: Debug secret relay (temporary)

# Temporary diagnostic: does a secret passed by a caller survive into a called
# reusable workflow's step environment? Prints only the received length,
# never the value. Called from dvl-front's debug PR via a branch ref.

on:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: true

jobs:
  relay:
    name: Report received secret length
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "received: EMPTY"
          else
            echo "received length: ${#OPENROUTER_API_KEY}"
          fi
